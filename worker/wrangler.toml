# depriver.tech engagement API: views, likes, comments, contact form and "Ask AI".
# Runs entirely on Cloudflare's free tier (Workers, D1, Workers AI, Turnstile).
name = "depriver-engage"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[build]
command = "node ../scripts/social-catalog.mjs"

[triggers]
crons = ["*/5 * * * *"]

[vars]
SITE_URL = "https://depriver.tech"
ALLOWED_ORIGINS = "https://depriver.tech,https://www.depriver.tech,http://localhost:4321"
AI_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
# Two switches: deployment gate here + Pause/Resume inside the private publisher.
SOCIAL_PUBLISHING_ENABLED = "false"
SOCIAL_API_URL = "https://depriver-engage.depriver-tech.workers.dev"
# Verify supported versions when connecting the developer apps.
LINKEDIN_API_VERSION = "202605"
INSTAGRAM_API_VERSION = "v25.0"

[ai]
binding = "AI"

# Created with: npx wrangler d1 create depriver-engage
[[d1_databases]]
binding = "DB"
database_name = "depriver-engage"
database_id = "07403856-d6f6-495c-bac4-931415d45a1d"

[observability]
enabled = true

# Create this private bucket before deployment; see docs/docs-archive.md.
[[r2_buckets]]
binding = "ARCHIVE_FILES"
bucket_name = "depriver-docs-archive"
