<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-label="Privatus Cosmas. Software Engineer, full-stack and mobile developer, CEO of INCPRITECH, based in Mbeya, Tanzania.">
<defs>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#a5f3fc"/><stop offset="1" stop-color="#818cf8"/>
<animate attributeName="x2" values="1;1.6;1" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="ring" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#6366f1" stop-opacity=".35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="900" height="160" rx="14"/></clipPath>
</defs>
<style>
.hi{font:600 13px 'SF Mono',ui-monospace,Menlo,Consolas,monospace;fill:#22d3ee;letter-spacing:2px}
.nm{font:800 36px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#name)}
.role{font:600 15px 'SF Mono',ui-monospace,Menlo,Consolas,monospace;fill:#67e8f9;opacity:0;animation:role 14.0s infinite}
.bio{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cbd5e1}
.meta{font:500 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8}
.mono{font:800 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
.f1{opacity:0;animation:up .8s ease-out .1s forwards}
.f2{opacity:0;animation:up .8s ease-out .4s forwards}
.f3{opacity:0;animation:up .8s ease-out .8s forwards}
.f4{opacity:0;animation:up .8s ease-out 1.1s forwards}
.tw{animation:tw 3s ease-in-out infinite}
.blob1{animation:d1 14s ease-in-out infinite}
.blob2{animation:d2 18s ease-in-out infinite}
.wave{animation:wv 12s linear infinite}
.wave2{animation:wv 20s linear infinite reverse}
.spin{transform-origin:800px 80px;animation:sp 14s linear infinite}
.spin2{transform-origin:800px 80px;animation:sp 22s linear infinite reverse}
.cur{animation:bl 1s steps(1) infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes role{0%{opacity:0;transform:translateY(6px)}3%,22.0%{opacity:1;transform:none}25.0%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(160px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-200px,-20px)}}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-450px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes bl{50%{opacity:0}}
</style>
<g clip-path="url(#c)">
<rect width="900" height="160" fill="#0b1120"/>
<circle class="blob1" cx="180" cy="40" r="170" fill="url(#b1)"/>
<circle class="blob2" cx="720" cy="130" r="190" fill="url(#b2)"/>
<circle cx="341" cy="46" r="1" fill="#e0f2fe" class="tw" style="animation-delay:2.60s"/><circle cx="84" cy="145" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:1.46s"/><circle cx="69" cy="137" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:0.15s"/><circle cx="454" cy="115" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:0.96s"/><circle cx="574" cy="116" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:3.31s"/><circle cx="136" cy="65" r="1.3" fill="#e0f2fe" class="tw" style="animation-delay:2.51s"/><circle cx="73" cy="109" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:3.91s"/><circle cx="57" cy="150" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:1.16s"/><circle cx="157" cy="146" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:2.28s"/><circle cx="583" cy="54" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:2.33s"/><circle cx="664" cy="56" r="1" fill="#e0f2fe" class="tw" style="animation-delay:0.39s"/><circle cx="739" cy="24" r="1.3" fill="#e0f2fe" class="tw" style="animation-delay:0.24s"/><circle cx="220" cy="135" r="1.3" fill="#e0f2fe" class="tw" style="animation-delay:2.13s"/><circle cx="805" cy="88" r="1" fill="#e0f2fe" class="tw" style="animation-delay:2.34s"/><circle cx="474" cy="100" r="1" fill="#e0f2fe" class="tw" style="animation-delay:0.99s"/><circle cx="194" cy="70" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:2.30s"/><circle cx="547" cy="134" r="1" fill="#e0f2fe" class="tw" style="animation-delay:2.92s"/><circle cx="304" cy="26" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:2.05s"/><circle cx="178" cy="95" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:3.73s"/><circle cx="441" cy="18" r="1.3" fill="#e0f2fe" class="tw" style="animation-delay:0.31s"/><circle cx="581" cy="88" r="1" fill="#e0f2fe" class="tw" style="animation-delay:2.78s"/><circle cx="618" cy="135" r="1.3" fill="#e0f2fe" class="tw" style="animation-delay:3.19s"/><circle cx="80" cy="31" r="1" fill="#e0f2fe" class="tw" style="animation-delay:1.90s"/><circle cx="690" cy="24" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:2.92s"/><circle cx="327" cy="122" r="1" fill="#e0f2fe" class="tw" style="animation-delay:2.87s"/><circle cx="694" cy="96" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:3.76s"/><circle cx="373" cy="51" r="1.3" fill="#e0f2fe" class="tw" style="animation-delay:0.47s"/><circle cx="70" cy="63" r="1" fill="#e0f2fe" class="tw" style="animation-delay:0.52s"/><circle cx="263" cy="109" r="1" fill="#e0f2fe" class="tw" style="animation-delay:3.67s"/><circle cx="518" cy="28" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:1.80s"/><circle cx="572" cy="79" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:3.28s"/><circle cx="573" cy="79" r="1.3" fill="#e0f2fe" class="tw" style="animation-delay:1.66s"/><circle cx="377" cy="105" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:0.60s"/><circle cx="190" cy="46" r="0.8" fill="#e0f2fe" class="tw" style="animation-delay:2.63s"/>
<path class="wave" d="M0 140 Q 112 120 225 140 T 450 140 T 675 140 T 900 140 T 1125 140 T 1350 140 V160 H0Z" fill="#22d3ee" opacity=".08"/>
<path class="wave2" d="M0 148 Q 112 132 225 148 T 450 148 T 675 148 T 900 148 T 1125 148 T 1350 148 V160 H0Z" fill="#6366f1" opacity=".10"/>
</g>
<rect x=".5" y=".5" width="899" height="159" rx="14" fill="none" stroke="#1e293b"/>
<text x="38" y="32" class="hi f1">HELLO, I'M</text>
<text x="36" y="68" class="nm f2">Privatus Cosmas</text>
<g class="f3"><text x="38" y="92" class="role" style="animation-delay:0.0s">Software Engineer · Full-Stack &amp; Mobile</text><text x="38" y="92" class="role" style="animation-delay:3.5s">Building AI tools and SDKs</text><text x="38" y="92" class="role" style="animation-delay:7.0s">Flutter apps people actually use</text><text x="38" y="92" class="role" style="animation-delay:10.5s">CEO @ INCPRITECH</text><rect x="30" y="80" width="2" height="16" fill="#22d3ee" class="cur"/></g>
<g class="f4">
<text x="38" y="118" class="bio">I build practical web, mobile and AI products that help people and businesses get things done.</text>
<text x="38" y="138" class="meta">Software Engineer @ Rohi Company Limited  ·  CEO @ INCPRITECH  ·  Computer Science, MUST  ·  Mbeya, Tanzania</text>
</g>
<g class="spin2"><circle cx="800" cy="80" r="62" fill="none" stroke="#334155" stroke-dasharray="2 6"/><circle cx="862" cy="80" r="3" fill="#a5b4fc"/></g>
<g class="spin"><circle cx="800" cy="80" r="46" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-dasharray="60 12"/><circle cx="800" cy="34" r="4" fill="#22d3ee"/><circle cx="754" cy="80" r="2.5" fill="#f472b6"/></g>
<circle cx="800" cy="80" r="32" fill="url(#ring)"/>
<text x="800" y="89" text-anchor="middle" class="mono">PC</text>
</svg>