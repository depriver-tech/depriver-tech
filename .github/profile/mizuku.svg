<svg xmlns="http://www.w3.org/2000/svg" width="270" height="150" viewBox="0 0 270 150" role="img" aria-label="mizuku: Live wallpapers for macOS">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x=".5" y=".5" width="269" height="149" rx="12"/></clipPath>
</defs>
<style>
.t{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f1f5f9}
.d{font:600 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e2e8f0}
.s{font:400 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8}
.chip{font:600 9.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f472b6}
.live{font:700 8.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f472b6;letter-spacing:1px}
.in{opacity:0;animation:in .7s ease-out 0.6s forwards}
.sweep{animation:sw 3.2s ease-in-out 0.6s infinite}
.pulse{transform-origin:244px 22px;animation:p 1.8s ease-out infinite}
.glow{animation:gl 8s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:br 1.6s ease-in-out infinite alternate}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sw{0%{transform:translateX(-120px)}60%,100%{transform:translateX(300px)}}
@keyframes p{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@keyframes gl{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-20px)}}
@keyframes br{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
</style>
<g clip-path="url(#c)">
<rect width="270" height="150" fill="#0b1120"/>
<circle class="glow" cx="250" cy="140" r="80" fill="url(#g)" opacity=".09"/>
<rect width="270" height="3" fill="url(#g)"/>
<rect class="sweep" width="90" height="3" fill="url(#sh)"/>
</g>
<rect x=".5" y=".5" width="269" height="149" rx="12" fill="none" stroke="#1e293b"/>
<g class="in">
<text x="20" y="34" class="t">mizuku</text>
<circle cx="244" cy="22" r="3.5" fill="#f472b6" class="pulse"/><circle cx="244" cy="22" r="3.5" fill="#f472b6"/>
<text x="236" y="25" text-anchor="end" class="live">ACTIVE</text>
<text x="20" y="58" class="d">Live wallpapers for macOS</text>
<text x="20" y="78" class="s">Native Swift app, fully open source</text>
<text x="20" y="96" class="s">Portable themes for your whole desktop</text>
<rect x="20" y="118" width="48" height="18" rx="9" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".35"/><text x="44" y="130.5" text-anchor="middle" class="chip">Swift</text><rect x="74.0" y="118" width="48" height="18" rx="9" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".35"/><text x="98" y="130.5" text-anchor="middle" class="chip">macOS</text><rect x="206" y="56" width="5" height="8" rx="1.5" fill="url(#g)" class="bar" style="animation-delay:0.60s"/><rect x="214" y="50" width="5" height="14" rx="1.5" fill="url(#g)" class="bar" style="animation-delay:0.75s"/><rect x="222" y="54" width="5" height="10" rx="1.5" fill="url(#g)" class="bar" style="animation-delay:0.90s"/><rect x="230" y="46" width="5" height="18" rx="1.5" fill="url(#g)" class="bar" style="animation-delay:1.05s"/><rect x="238" y="52" width="5" height="12" rx="1.5" fill="url(#g)" class="bar" style="animation-delay:1.20s"/><rect x="246" y="48" width="5" height="16" rx="1.5" fill="url(#g)" class="bar" style="animation-delay:1.35s"/>
</g>
</svg>