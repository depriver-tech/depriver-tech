<svg xmlns="http://www.w3.org/2000/svg" width="270" height="130" viewBox="0 0 270 130" role="img" aria-label="depriver.tech: Storytelling site &amp; blog">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x=".5" y=".5" width="269" height="129" rx="12"/></clipPath>
</defs>
<style>
.t{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f1f5f9}
.d{font:500 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cbd5e1}
.s{font:400 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8}
.chip{font:600 9.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#34d399}
.live{font:700 8.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#34d399;letter-spacing:1px}
.in{opacity:0;animation:in .7s ease-out 1.2s forwards}
.sweep{animation:sw 3.2s ease-in-out 1.2s infinite}
.pulse{transform-origin:244px 22px;animation:p 1.8s ease-out infinite}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sw{0%{transform:translateX(-120px)}60%,100%{transform:translateX(300px)}}
@keyframes p{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
</style>
<g clip-path="url(#c)">
<rect width="270" height="130" fill="#0b1120"/>
<rect width="270" height="3" fill="url(#g)"/>
<rect class="sweep" width="90" height="3" fill="url(#sh)"/>
<circle cx="250" cy="125" r="70" fill="url(#g)" opacity=".07"/>
</g>
<rect x=".5" y=".5" width="269" height="129" rx="12" fill="none" stroke="#1e293b"/>
<g class="in">
<text x="20" y="34" class="t">depriver.tech</text>
<circle cx="244" cy="22" r="3.5" fill="#34d399" class="pulse"/><circle cx="244" cy="22" r="3.5" fill="#34d399"/>
<text x="236" y="25" text-anchor="end" class="live">ACTIVE</text>
<text x="20" y="58" class="d">Storytelling site &amp; blog</text>
<text x="20" y="76" class="s">Motion-first writing, on the edge</text>
<rect x="20" y="96" width="48" height="18" rx="9" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".35"/><text x="44" y="108.5" text-anchor="middle" class="chip">Astro</text><rect x="74.0" y="96" width="42" height="18" rx="9" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".35"/><text x="95" y="108.5" text-anchor="middle" class="chip">GSAP</text><rect x="121.6" y="96" width="80" height="18" rx="9" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".35"/><text x="162" y="108.5" text-anchor="middle" class="chip">Cloudflare</text>
</g>
</svg>